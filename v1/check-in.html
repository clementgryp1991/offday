<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><title>check-in · offday</title></head><body><div id="hdr"></div>
<section class="ci-hero"><h1>check-in</h1><p>almost ready for your offday.</p></section>
<div class="cart"><div class="panel"><h2>your room</h2><p id="cnt"></p><div id="lines"></div>
 <div class="gift"><div class="t"><h3 id="gift-t"></h3><p id="gift-p"></p><div class="bar"><i></i></div><div class="bar-l"><span id="bar-now"></span><span data-threshold></span></div></div><img src="img/sleutel-hand.jpg" alt="room 00 key"></div>
 <h3 style="font-size:22px;margin-top:22px">something else for your room?</h3>
 <div class="ups">
  <div class="up"><img src="img/lijn.jpg" alt=""><div><h4>reset mist</h4><span data-price="reset-mist"></span><br><button class="btn sm" data-add="reset-mist">add →</button></div></div>
  <div class="up"><img src="img/plank.jpg" alt=""><div><h4>radiance serum</h4><span data-price="radiance-serum"></span><br><button class="btn sm" data-add="radiance-serum">add →</button></div></div>
  <div class="up"><img src="img/koffer.jpg" alt=""><div><h4>late check-out kit</h4><span data-price="late-check-out"></span><br><button class="btn sm" data-add="late-check-out">add →</button></div></div>
 </div></div>
<aside class="panel side-sum"><h2>your stay</h2><div class="sum" style="margin-top:14px"><div><span>subtotal (<span id="s-n"></span> items)</span><span id="s-sub"></span></div><div><span>shipping</span><span id="s-ship"></span></div><div><span>discount</span><span>—</span></div><div class="tot"><span>total</span><span id="s-tot"></span></div></div>
 <div class="code"><input placeholder="key code" aria-label="discount code"><button>apply</button></div>
 <h3 style="font-size:20px">delivery to your room</h3>
 <div class="ship"><label><input type="radio" name="ship" value="std" checked><span>standard check-in<br><small>3 – 5 business days · free from €50.00</small></span><b>€4.95</b></label><label><input type="radio" name="ship" value="express"><span>express to your room<br><small>1 – 2 business days</small></span><b>€9.95</b></label></div>
 <button class="btn" style="width:100%;justify-content:center;font-size:18px" onclick="alert('this is a demo: checkout is not connected yet.')">check in now →</button>
 <p class="small">secure payment with bancontact, ideal or card</p></aside></div>
<div id="ftr"></div><script src="app.js"></script></body></html>
